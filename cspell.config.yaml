$schema: "https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json"
version: "0.2"
language: en
allowCompoundWords: true
ignorePaths:
  - ".git"
  - ".claude"
  - "_site"
  - ".jekyll-cache"
  - "vendor"
  - "Gemfile.lock"
  - "pico.min.css"
  - "devlog.md" # historical record, kept as written
words:
  - aedsim
  - gshaw
  - kramdown
  - aedsimulator # Cloudflare Pages project name
  - ogimage # front matter key for the Open Graph image
  - pico
  - qrcode
