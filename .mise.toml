[tools]
ruby = "3.4.4" # Cloudflare Pages build image v3 preinstalls 3.4.4; any other version compiles from source (~3 min per build)
node = "24.4.1"
"npm:cspell" = "9.1.5"
"npm:markdownlint-cli2" = "0.22.1"
"gem:html-proofer" = "5.2.1"

[tasks.install]
run = "bundle install"

[tasks.dev]
run = "bundle exec jekyll serve --livereload --livereload-port 35705 --open-url --port 4005"

[tasks.build]
run = "bundle exec jekyll build --quiet"

[tasks.spell]
run = "cspell lint --no-progress ."

[tasks.markdownlint]
run = """
out=$(markdownlint-cli2 '**/*.md' 2>&1) && echo "Markdown lint passed" || { echo "$out"; exit 1; }
"""

# Internal links only. External sites rate-limit and flake; check them by hand
# with `htmlproofer _site` when it matters.
[tasks.links]
depends = ["build"]
run = "htmlproofer _site --disable-external --no-check-internal-hash"

[tasks.check]
depends = ["spell", "markdownlint", "links"]

# Run by deploy once Cloudflare Pages has built main.
[tasks.verify]
run = """
set -e
curl -fsS https://aedsim.com/ | grep -q "<title>AED Sim"
echo "aedsim.com is up"
test "$(curl -s -o /dev/null -w '%{http_code}' https://aedsim.com/no-such-page/)" = 404
echo "404 page works"
"""

# The one way to production. See Workshop's Tooling/deploy.md. Cloudflare Pages
# builds main on push, so the push is the deploy and main may be ahead of origin.
# The guard runs again after check in case check changed a file.
[tasks.deploy]
run = [
  "scripts/deploy-guard.sh --allow-ahead",
  "mise run check",
  "scripts/deploy-guard.sh --allow-ahead",
  "git push origin main",
  "scripts/pages-status.sh --wait",
  "mise run verify",
  'echo "✅ $(git rev-parse --short HEAD) is live on aedsim.com and verified."',
]

[tasks.deploy-status]
run = "scripts/pages-status.sh"
